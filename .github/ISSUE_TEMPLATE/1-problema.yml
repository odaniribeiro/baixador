name: "Relatar um problema"
description: "Algo não funcionou como deveria no Baixador."
title: "[Problema] "
labels: ["bug", "triagem"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por avisar! Quanto mais detalhes, mais rápido dá para resolver.
        Antes de enviar, veja se já não existe uma issue igual na aba **Issues**.
        **Não coloque aqui senhas, chaves de API nem dados pessoais:** tudo o que você escrever fica público.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: "O que aconteceu?"
      description: "Conte o que você viu. Se apareceu alguma mensagem, copie o texto aqui."
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: "Como fazer acontecer de novo"
      description: "O passo a passo até o problema aparecer."
      placeholder: |
        1. Colei o link ...
        2. Escolhi a qualidade ...
        3. ...
  - type: textarea
    id: esperado
    attributes:
      label: "O que você esperava que acontecesse?"
  - type: input
    id: versao-app
    attributes:
      label: "Versão do Baixador"
      description: "Aparece no menu do canto, dentro do app."
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: "Computador"
      options: ["Mac", "Windows"]
    validations:
      required: true
  - type: input
    id: versao-sistema
    attributes:
      label: "Versão do sistema"
      description: "No Mac: menu Apple › Sobre Este Mac. No Windows: Configurações › Sistema › Sobre."
      placeholder: "macOS 26.1 ou Windows 11"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: "Link que deu problema (se puder compartilhar)"
      placeholder: "https://…"
  - type: textarea
    id: anexos
    attributes:
      label: "Imagens ou vídeo"
      description: "Se puder, arraste aqui uma captura de tela ou uma gravação mostrando o problema."
